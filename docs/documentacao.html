<style>
:root {
  --bg: #07080c;
  --s1: #0b0d13;
  --s2: #10131b;
  --s3: #171b26;
  --s4: #212636;
  --ink: #e9ecf4;
  --ink-2: #aab0c3;
  --ink-3: #7f869b;
  --hair: rgba(233, 236, 244, 0.07);
  --magenta: #ff8a3d;
  --ambar: #ffb020;
  --vermelho: #ff6a5e;
  --verde: #4fd1a1;
  --ciano: #5ec8ff;
  --magenta-acesa: #ffb27a;
  --lilas: #c9a6ff;
  --demanda: #ff4fa3; 
  --humor: var(--magenta);
  --display: 'Sofia Sans Extra Condensed', 'Geist Sans', sans-serif;
  --sans: 'Geist Sans', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
  --raio: 14px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}

:root[data-humor='rodando'] { --humor: var(--ambar); }
:root[data-humor='erro'] { --humor: var(--vermelho); }
:root[data-humor='feito'] { --humor: var(--verde); }
:root[data-humor='ouvindo'] { --humor: var(--ciano); }
:root[data-humor='falando'] { --humor: var(--magenta-acesa); }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
  overflow: hidden;
}

::selection { background: color-mix(in oklab, var(--humor) 38%, transparent); color: var(--ink); }
:focus-visible { outline: 2px solid color-mix(in oklab, var(--humor) 80%, white); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 10px; border: 3px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
input, textarea, button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
a { color: inherit; text-underline-offset: 3px; }
.num, time, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }



.app {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  height: 100vh;
  position: relative;
  isolation: isolate;
}


.app::before {
  content: '';
  position: absolute;
  inset: -20vh auto auto -18vw;
  width: 70vw;
  height: 70vh;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--humor) 22%, transparent), transparent);
  pointer-events: none;
  z-index: -1;
  transition: background 1.2s var(--ease);
}



.lateral {
  display: flex;
  flex-direction: column;
  background: color-mix(in oklab, var(--s1) 86%, transparent);
  padding: 22px 16px 16px;
  min-height: 0;
  gap: 18px;
  
  overflow-y: auto;
}

.marca {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 8px;
}
.marca b { font: 800 26px/1 var(--display); letter-spacing: 0.04em; }
.marca span { font: 400 11px/1 var(--mono); color: var(--ink-3); letter-spacing: 0.06em; }

.presenca { display: grid; justify-items: center; gap: 2px; margin-top: -4px; }
.moldura { position: relative; }
.orbe { position: relative; }
.orbe canvas { display: block; }

.orbe[data-sem-webgl='true'] {
  border-radius: 50%;
  background: radial-gradient(circle, transparent 30%, color-mix(in oklab, var(--humor) 40%, white) 34%, var(--humor) 44%, #2a1206 56%, transparent 60%);
  transform: scale(0.8) scaleY(0.5);
}
.estado-ia {
  font: 800 48px/0.95 var(--display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in oklab, var(--humor) 55%, var(--ink));
  transition: color 0.8s var(--ease);
  margin-top: -10px;
}
.mostrador { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mostrador .aro { fill: none; stroke: var(--hair); stroke-width: 1; }
.mostrador .tick { stroke: color-mix(in oklab, var(--ink-3) 45%, transparent); stroke-width: 1; }
.mostrador .tick.longo { stroke: var(--ink-3); }
.mostrador .tick.agora { stroke: var(--humor); stroke-width: 2; }
.estado-sub {
  font: 400 13px/1.4 var(--sans);
  color: var(--ink-2);
  min-height: 17px;
  text-align: center;
  max-width: 250px;
}


.botao-especial {
  --cor-especial: #4fe160;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid color-mix(in oklab, var(--cor-especial) 45%, transparent);
  border-radius: var(--raio);
  background: linear-gradient(135deg, color-mix(in oklab, var(--cor-especial) 14%, var(--s2)), var(--s1) 70%);
  box-shadow: 0 0 0 0 transparent, inset 0 1px 0 color-mix(in oklab, var(--cor-especial) 18%, transparent);
  color: var(--ink);
  font: 700 12px/1.2 var(--sans);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: left;
  transition: box-shadow 0.28s var(--ease), border-color 0.28s var(--ease), transform 0.18s var(--ease);
}
.botao-especial:hover { border-color: var(--cor-especial); box-shadow: 0 0 22px -6px var(--cor-especial); transform: translateY(-1px); }
.botao-especial[aria-current='page'] { border-color: var(--cor-especial); box-shadow: 0 0 18px -8px var(--cor-especial); }
.botao-especial img, .botao-especial svg { flex: none; width: 30px; height: 30px; }
.botao-especial svg { color: var(--cor-especial); stroke-width: 1.6; }
.lateral[data-recolhida] .botao-especial { justify-content: center; padding: 8px; }
.lateral[data-recolhida] .botao-especial span { display: none; }

.alas { display: grid; gap: 2px; }
.alas.sistema { margin-top: auto; }
.alas h2 {
  font: 500 11px/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 8px;
  padding: 0 10px;
}
.ala-item {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-2);
  text-align: left;
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.ala-item:hover { background: var(--s3); color: var(--ink); }
.ala-item[aria-current='page'] { background: var(--s3); color: var(--ink); }
.ala-item[aria-current='page'] svg { color: var(--magenta); }
.ala-item svg { width: 17px; height: 17px; stroke-width: 1.6; }
.ala-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ala-numero { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ambar); color: var(--bg); font: 600 11px/18px var(--mono); text-align: center; }
.lateral[data-recolhida] .ala-item { position: relative; }
.lateral[data-recolhida] .ala-numero { position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 3px; font-size: 9.5px; line-height: 15px; }

.relogio-lateral { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px 0; color: var(--ink-3); font: 400 11px/1 var(--mono); letter-spacing: 0.06em; }


.marca span { margin-left: auto; }
.recolher {
  display: grid;
  place-items: center;
  align-self: center;
  margin-left: 8px;
  padding: 5px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-3);
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.recolher:hover { background: var(--s3); color: var(--ink); }
.recolher svg { width: 17px; height: 17px; stroke-width: 1.6; }
.app:has(> .lateral[data-recolhida]) { grid-template-columns: 72px minmax(0, 1fr); }
.lateral[data-recolhida] { padding: 22px 10px 16px; scrollbar-width: none; }
.lateral[data-recolhida] .marca { justify-content: center; padding: 0; }
.lateral[data-recolhida] .recolher { margin-left: 0; }
.lateral[data-recolhida] :is(.marca b, .marca span, .estado-ia, .estado-sub, .alas h2, .ala-item span, .relogio-lateral) { display: none; }
.lateral[data-recolhida] .ala-item { grid-template-columns: 22px; justify-content: center; padding: 9px; }



.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 12px; border-radius: 8px; border: 0;
  background: var(--s3); color: var(--ink);
  font: 500 13px/1 var(--sans);
  white-space: nowrap;
  transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
}
.btn:hover:not(:disabled) { background: var(--s4); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; }
.btn svg { width: 15px; height: 15px; stroke-width: 1.8; }
.btn.primario { background: var(--ink); color: var(--bg); }
.btn.primario:hover:not(:disabled) { background: #fff; }
.btn.fantasma { background: transparent; color: var(--ink-2); }
.btn.fantasma:hover:not(:disabled) { background: var(--s3); color: var(--ink); }
.btn.pequeno { height: 28px; padding: 0 10px; font-size: 12px; }
.btn[aria-pressed='true'] { background: color-mix(in oklab, var(--magenta) 22%, var(--s2)); color: var(--ink); }
.btn[aria-pressed='true'] .num { color: var(--magenta-acesa); }



.principal { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; min-width: 0; }
.rolagem { overflow-y: auto; padding: 34px clamp(24px, 3.4vw, 56px) 40px; }

.topo {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  margin-bottom: 26px;
}
.topo h1 {
  font: 800 clamp(64px, 7vw, 104px)/0.84 var(--display);
  letter-spacing: 0.005em;
  text-transform: uppercase;
  margin: 0;
}
.topo .sub { color: var(--ink-2); font-size: 16px; margin: 10px 0 0; }

.vazio-ala { padding: 60px 24px; text-align: center; color: var(--ink-2); background: var(--s1); border-radius: var(--raio); }
.vazio-ala p { margin: 0 auto; max-width: 52ch; }
.carregando { color: var(--ink-3); padding: 24px 4px; font: 400 13px/1 var(--mono); }



.player { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; background: var(--s1); border-radius: var(--raio); padding: 12px; margin-bottom: 22px; }
.player video { display: block; width: 100%; max-height: 62vh; border-radius: 10px; background: #000; }
.player-info { display: flex; align-items: center; gap: 10px; padding: 0 4px 2px; }
.player-info .video-nome { flex: 1; }
.player-info .video-nome b { font-size: 16px; }
.player-info .video-nome b::first-letter { text-transform: uppercase; }
.player-info .btn svg { color: var(--magenta); }

.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.tema { background: var(--s1); border-radius: var(--raio); padding: 16px 16px 10px; min-width: 0; }
.tema h2 {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font: 800 30px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase;
  margin: 0 0 10px; padding: 0 4px;
}
.tema h2 span { min-width: 0; overflow-wrap: anywhere; text-align: right; font: 400 11px/1.3 var(--mono); letter-spacing: 0.06em; color: var(--ink-3); text-transform: none; }
.tema ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pasta-video { margin-top: 6px; border-radius: 10px; background: var(--s2); }
.pasta-video summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 10px; cursor: pointer; font: 500 12px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.pasta-video summary .num { color: var(--ink-3); }
.pasta-video[open] summary { color: var(--ink); }
.pasta-video ul { padding: 0 4px 6px; }
.pasta-video .video:hover { background: var(--s3); }
.video {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 2px 4px 2px 0; border-radius: 10px;
  transition: background 0.2s var(--ease);
}
.video:hover { background: var(--s2); }
.video[aria-current] { background: color-mix(in oklab, var(--magenta) 10%, var(--s2)); }
.video-tocar { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 6px 6px; border: 0; background: none; text-align: left; border-radius: 10px; }
.video-tocar > svg { width: 15px; height: 15px; flex: none; color: var(--magenta); stroke-width: 1.8; }
.video-nome { display: grid; gap: 3px; min-width: 0; }
.video-nome b { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video .video-nome b::first-letter { text-transform: uppercase; }
.video-nome small { color: var(--ink-3); font-size: 11px; letter-spacing: 0.03em; }
.video .btn { opacity: 0; transition: opacity 0.2s var(--ease); }
.video:hover .btn, .video:focus-within .btn, .video[aria-current] .btn { opacity: 1; }
.vazio-linha { color: var(--ink-2); margin: 0; padding: 4px; font-size: 14px; }


.fabrica { display: grid; gap: 14px; }
.fabrica-barra { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.fabrica-vazia { margin: 0; padding: 14px 4px; color: var(--ink-2); font-size: 14px; }
.filme-na-barra {
  --cor: var(--ciano);
  display: grid; gap: 6px; flex: 0 0 auto; width: 220px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 12px;
  background: var(--s1); color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
}
.filme-na-barra:hover { background: var(--s2); }
.filme-na-barra[aria-pressed='true'] { border-color: color-mix(in oklab, var(--cor) 60%, transparent); background: var(--s2); }
.filme-na-barra[data-situacao='parado'] { --cor: var(--ambar); background: color-mix(in oklab, var(--ambar) 10%, var(--s1)); }
.filme-na-barra[data-situacao='erro'] { --cor: var(--vermelho); }
.filme-na-barra[data-situacao='entregue'] { --cor: var(--verde); }
.filme-na-barra b { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filme-na-barra b::first-letter, .filme-aberto h2::first-letter { text-transform: uppercase; }
.filme-situacao { color: var(--cor); font: 500 11px/1.2 var(--mono); letter-spacing: 0.03em; }
.etapas-do-filme { display: flex; gap: 3px; }
.etapa { flex: 1; height: 5px; border-radius: 3px; background: var(--s4); }
.etapa[data-situacao='pronto'] { background: color-mix(in oklab, var(--ink-3) 70%, var(--s4)); }
.etapa[data-situacao='trabalhando'] { background: var(--ciano); }
.etapa[data-situacao='erro'] { background: var(--vermelho); }
.etapa[aria-current='step'] { background: var(--cor); box-shadow: 0 0 8px color-mix(in oklab, var(--cor) 70%, transparent); }
.filme-erro { margin: 0; color: var(--vermelho); font-size: 12px; overflow-wrap: anywhere; }
.fabrica-corpo { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 14px; align-items: start; }
.fabrica-conversa, .filme-aberto { background: var(--s1); border-radius: var(--raio); padding: 14px 16px; min-width: 0; }
.fabrica-conversa h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font: 800 24px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.fabrica-conversa h2 svg { width: 16px; height: 16px; color: var(--magenta); }
.fabrica-conversa p { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.filme-aberto header { display: grid; gap: 4px; margin-bottom: 12px; }
.filme-aberto h2 { margin: 0; font: 800 30px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; overflow-wrap: anywhere; }
.filme-aberto header .mono { color: var(--ink-3); font-size: 12px; }
.filme-noticia { margin: 0; color: var(--ink-2); font-size: 13px; }
.filme-aberto .abas { margin-bottom: 12px; }
.parte-do-filme p { margin: 0; padding: 18px 4px; color: var(--ink-2); font-size: 14px; line-height: 1.5; max-width: 62ch; }


.estilos { display: grid; gap: 16px; }
.estilos .vazio-ala .mono { color: var(--ink); overflow-wrap: anywhere; }
.familia-estilos { padding-bottom: 16px; }
.grade-estilos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.estilo { display: flex; flex-direction: column; min-width: 0; border-radius: 12px; background: var(--s2); overflow: hidden; transition: background 0.2s var(--ease); }
.estilo:hover { background: var(--s3); }
.estilo[aria-current] { background: color-mix(in oklab, var(--magenta) 10%, var(--s2)); }
.estilo-previa { display: block; position: relative; aspect-ratio: 16 / 9; padding: 0; border: 0; background: #000; cursor: pointer; }
.estilo-previa video { display: block; width: 100%; height: 100%; object-fit: cover; }
.estilo-sem-video { display: grid; place-items: center; height: 100%; color: var(--ink-3); font: 400 11px/1 var(--mono); letter-spacing: 0.06em; }
.estilo-info { display: grid; gap: 6px; padding: 10px 12px 12px; flex: 1; align-content: start; }
.estilo-info b { font-weight: 500; font-size: 14px; }
.estilo-info p { margin: 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.4; }
.estilo-pe { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.estilo-chips { display: flex; flex-wrap: wrap; gap: 4px; }

.ala-biblioteca > .topo-acoes { margin-bottom: 18px; }

.categoria-biblioteca { display: grid; gap: 10px; }

.feito-biblioteca, .feito-estilo { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--s2); color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }



.aviso {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: 12px; margin-bottom: 22px;
  background: color-mix(in oklab, var(--vermelho) 10%, var(--s1));

}

.tubo {
  --pa: #ff8a3d; --pb: #4a1a08; --pc: #ffe6d2; 
  --alt: 18px;
  display: grid; gap: 7px; min-width: 0;
}
.tubo[data-rodando='true'] { --pa: #ffb020; --pb: #7a2a06; --pc: #fff1cf; }
.tubo[data-fino='true'] { --alt: 8px; }
.tubo-vidro {
  position: relative; height: var(--alt); border-radius: 999px; overflow: hidden;
  background:
    linear-gradient(180deg, rgba(233, 236, 244, 0.07), transparent 45%, rgba(0, 0, 0, 0.4)),
    color-mix(in oklab, var(--pb) 22%, var(--bg));
  box-shadow: inset 0 1px 0 rgba(233, 236, 244, 0.06), inset 0 -2px 5px rgba(0, 0, 0, 0.55);
}
.tubo-plasma {
  position: absolute; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 4px) * var(--pct) / 100);
  min-width: calc(var(--alt) - 4px);
  border-radius: 999px; overflow: hidden;
  background: linear-gradient(180deg, var(--pc) -30%, var(--pa) 34%, var(--pb) 115%);
  animation: enche 1.6s var(--ease) both;
  transition: filter 1s var(--ease);
}
.tubo[data-fino='true'] .tubo-plasma { top: 1px; bottom: 1px; left: 1px; width: calc((100% - 2px) * var(--pct) / 100); }
.tubo-nebulosa {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 40%, color-mix(in oklab, var(--pc) 70%, transparent) 0 0.6px, transparent 1.2px) 0 0 / 29px 11px,
    radial-gradient(circle at 70% 75%, color-mix(in oklab, var(--pc) 45%, transparent) 0 0.5px, transparent 1.1px) 0 0 / 43px 13px,
    radial-gradient(38% 130% at 22% 42%, color-mix(in oklab, var(--pc) 55%, transparent), transparent 72%) 0 0 / 180px 100%,
    radial-gradient(30% 150% at 62% 72%, color-mix(in oklab, var(--pb) 90%, transparent), transparent 72%) 0 0 / 240px 100%,
    radial-gradient(34% 120% at 86% 28%, color-mix(in oklab, var(--pa) 70%, var(--pc)), transparent 70%) 0 0 / 140px 100%;
  background-repeat: repeat;
  opacity: 0.9;
  animation: deriva 16s linear infinite;
}

.tubo-plasma::after {
  content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 12px;
  background: radial-gradient(closest-side, var(--pc), transparent);
  animation: menisco 2.6s ease-in-out infinite alternate;
}
.tubo-reflexo {
  position: absolute; left: 7px; right: 7px; top: 2px; height: 32%;
  border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0));
}
.tubo[data-fino='true'] .tubo-reflexo { left: 3px; right: 3px; top: 1px; height: 30%; }
.tubo[data-rodando='true'] .tubo-nebulosa { animation-duration: 3.5s; }
.tubo[data-rodando='true'] .tubo-plasma::after { animation-duration: 0.7s; }

.tubo[data-frio='true'] .tubo-plasma { filter: saturate(0.3) brightness(0.72); }
.tubo[data-frio='true'] .tubo-nebulosa { animation-duration: 48s; }
.tubo-marcas { display: grid; padding: 0 2px; height: 6px; align-items: start; }
.tubo-marcas i { justify-self: center; width: 1px; height: 4px; background: color-mix(in oklab, var(--ink-3) 40%, transparent); }
.tubo-marcas i[data-acesa='true'] { height: 6px; width: 1.5px; background: color-mix(in oklab, var(--pa) 80%, var(--ink)); }
.tubo[data-frio='true'] .tubo-marcas i[data-acesa='true'] { background: var(--ink-3); }

@keyframes enche { from { clip-path: inset(0 100% 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }
@keyframes deriva { to { background-position: 58px 0, -43px 0, 180px 0, -240px 0, 280px 0; } }
@keyframes menisco { from { opacity: 0.55; } to { opacity: 1; } }

<script type="application/json" id="dados">{"adrs": [{"amended_by": null, "amends": null, "body_md": "O IAE precisa de um painel igual ao Hospital OS. Havia duas formas: copiar o OS e as skills para o reposit\u00f3rio do IAE, ou extrair um n\u00facleo compartilhado que os dois projetos usariam. Escolhemos a c\u00f3pia solta, feita com o kit `tools/instalar-fluxo/` do Hospital. O n\u00facleo compartilhado custa caro agora e mexe no Hospital, que est\u00e1 em produ\u00e7\u00e3o. Depois da c\u00f3pia, cada OS evolui sozinho. Se aparecer um terceiro cliente, reavaliamos a extra\u00e7\u00e3o do n\u00facleo.", "cita": [], "decisao": "O IAE precisa de um painel igual ao Hospital OS. Havia duas formas: copiar o OS e as skills para o reposit\u00f3rio do IAE, ou extrair um n\u00facleo compartilhado que os dois projetos usariam. Escolhemos a c\u00f3pia solta, feita com o kit...", "emenda": [], "emendada_por": [], "file": "docs/adr/0001-iae-os-e-uma-copia-solta-do-hospital-os.md", "number": 1, "slug": "0001-iae-os-e-uma-copia-solta-do-hospital-os", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O IAE OS \u00e9 uma c\u00f3pia solta do Hospital OS"}, {"amended_by": null, "amends": null, "body_md": "A plataforma precisa entregar aulas em v\u00eddeo com qualidade adapt\u00e1vel e custo que n\u00e3o cres\u00e7a com o n\u00famero de alunos. A pesquisa dos s\u00f3cios recomendava o Mux no come\u00e7o, e a Ponte t\u00e9cnica do IAE prop\u00f4s ffmpeg no computador com armazenamento no R2. Escolhemos o caminho do IAE: o Operador converte o Original em HLS (H.264, 360p, 720p e 1080p, peda\u00e7os de 6 s) com um script no pr\u00f3prio computador, sobe o V\u00eddeo e o Original para o R2 e registra o V\u00eddeo pela API. Nenhum servidor nosso converte nem serve v\u00eddeo: a VPS guarda s\u00f3 metadados e progresso, e o navegador do aluno baixa os peda\u00e7os direto do R2 pelo cache da Cloudflare.\n\n## Considered Options\n\n- **Mux:** upload pelo navegador, legenda autom\u00e1tica e token assinado prontos. Custa R$ 0 at\u00e9 cerca de 200 alunos e cerca de R$ 730 por m\u00eas com 500. Exigiria re-converter o acervo na migra\u00e7\u00e3o.\n- **Worker de convers\u00e3o na nuvem:** tira a depend\u00eancia do computador do Operador, mas \u00e9 mais um servidor para manter e foi vetado pelos s\u00f3cios (nada de v\u00eddeo nos servidores do app).\n- **ffmpeg no computador do Operador + R2 (escolhida):** custo quase fixo (armazenamento a US$ 0,015 por GB, sa\u00edda gr\u00e1tis), formato padr\u00e3o desde o in\u00edcio, sem migra\u00e7\u00e3o futura. O pre\u00e7o \u00e9 uma rotina manual por aula e a legenda fora do caminho principal.\n\n## Consequences\n\n- A rotina de subida depende de uma pessoa com o script instalado. Por isso h\u00e1 dois Operadores desde o in\u00edcio.\n- Prote\u00e7\u00e3o por token em cada peda\u00e7o exige um Cloudflare Worker (plano pago, cerca de R$ 25 por m\u00eas). A primeira vers\u00e3o fica sem ele, com as URLs j\u00e1 preparadas para receb\u00ea-lo.\n- Legenda n\u00e3o vem de gra\u00e7a; entra depois, gerada no computador do Operador.", "cita": [], "decisao": "A plataforma precisa entregar aulas em v\u00eddeo com qualidade adapt\u00e1vel e custo que n\u00e3o cres\u00e7a com o n\u00famero de alunos. A pesquisa dos s\u00f3cios recomendava o Mux no come\u00e7o, e a Ponte t\u00e9cnica do IAE prop\u00f4s ffmpeg no computador com armazenamento...", "emenda": [], "emendada_por": [], "file": "docs/adr/0002-video-convertido-no-computador-do-operador-e-servido-do-r2.md", "number": 2, "slug": "0002-video-convertido-no-computador-do-operador-e-servido-do-r2", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O V\u00eddeo \u00e9 convertido no computador do Operador e servido do Cloudflare R2"}, {"amended_by": null, "amends": null, "body_md": "O `CLAUDE.md` manda tudo em pt-BR, e isso vale para o que o time l\u00ea: issues, PRs, ADRs, telas e mensagens. Para o c\u00f3digo da Plataforma de cursos (nomes de tabelas, colunas, classes, rotas e vari\u00e1veis) escolhemos ingl\u00eas: `course`, `lesson`, `video`, `enrollment`, `lesson_progress`. Bibliotecas, exemplos e agentes de c\u00f3digo trabalham melhor assim, e nomes de tabela s\u00e3o caros de mudar. O gloss\u00e1rio em `CONTEXT.md` \u00e9 a ponte: cada termo em pt-BR tem o nome em ingl\u00eas que o c\u00f3digo usa. A alternativa, tabelas em pt-BR, misturaria `matricula` com `created_at` e `user_id` e foi descartada.", "cita": [], "decisao": "O `CLAUDE.md` manda tudo em pt-BR, e isso vale para o que o time l\u00ea: issues, PRs, ADRs, telas e mensagens. Para o c\u00f3digo da Plataforma de cursos (nomes de tabelas, colunas, classes, rotas e vari\u00e1veis) escolhemos ingl\u00eas: `course`, `lesson`...", "emenda": [], "emendada_por": [], "file": "docs/adr/0003-codigo-e-banco-em-ingles-telas-e-docs-em-pt-br.md", "number": 3, "slug": "0003-codigo-e-banco-em-ingles-telas-e-docs-em-pt-br", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "C\u00f3digo e banco em ingl\u00eas, telas e docs em pt-BR"}], "fluxo": {"arestas": [{"de": "grill", "para": "porta"}, {"de": "porta", "meio": 0.3, "para": "toprd", "rotulo": "A: pedido grande"}, {"de": "porta", "para": "issue", "rotulo": "B: uma tarefa s\u00f3"}, {"de": "porta", "meio": 0.3, "para": "ship", "rotulo": "C: ajuste pequeno"}, {"de": "toprd", "para": "toissues"}, {"de": "toissues", "para": "montar"}, {"de": "montar", "para": "onda"}, {"de": "issue", "para": "onda"}, {"de": "onda", "para": "revisao"}, {"de": "ship", "modo": "lado", "para": "revisao"}, {"de": "revisao", "para": "merge", "rotulo": "tudo certo"}, {"de": "merge", "para": "deploy"}, {"de": "deploy", "para": "demonstracao", "rotulo": "no ar"}], "fonte": "Pacote do fluxo (ADR 0023 do PedroOS). Mude aqui e vale em todo Projeto; a raia pr\u00f3pria de um Projeto fica em `raias`, no bloco `fluxo` de projetos/<nome>.json.", "grade": {"coluna": 90, "largura": 1110, "linha": 96}, "legenda": [{"classe": "auto", "texto": "autom\u00e1tico: o agente faz sozinho"}, {"classe": "humano", "texto": "parada humana: uma pessoa precisa agir"}, {"classe": "decisao", "texto": "decis\u00e3o: uma pergunta escolhe o caminho"}], "nos": [{"classe": "auto", "comando": "/grill-with-docs, e /express para fechar em lote", "detalhe": "O agente faz perguntas, uma rodada por vez, at\u00e9 o pedido ficar claro, e anota no gloss\u00e1rio e nas decis\u00f5es o que ficou combinado. Se voc\u00ea n\u00e3o quiser responder tudo, o /express fecha o grill em lote: responde o que falta com a recomenda\u00e7\u00e3o dele e mostra uma tabela para voc\u00ea aprovar. Depois disso, o trabalho segue pelos passos de baixo.", "id": "grill", "skill": "grill-with-docs", "sub": ["perguntas at\u00e9 o plano ficar claro", "o /express fecha em lote"], "titulo": "/grill-with-docs", "w": 300, "x": 6, "y": 0.0}, {"classe": "decisao", "comando": "o grill escolhe a porta no fim", "detalhe": "No fim do grill, o pedido ganha uma porta. A: pedido grande, que vira v\u00e1rias tarefas, mexe no banco ou precisa de quem decide. B: uma tarefa s\u00f3, que cabe numa sess\u00e3o. C: um ajuste pequeno, que vai direto para o PR.", "id": "porta", "sub": "o tamanho do pedido decide", "titulo": "Qual porta?", "w": 300, "x": 6, "y": 1.1}, {"classe": "auto", "comando": "/to-prd", "detalhe": "Transforma a conversa num plano escrito, o PRD, e publica como issue no GitHub. O come\u00e7o dele \u00e9 em linguagem simples, para quem decide entender o que vai mudar sem ler c\u00f3digo.", "id": "toprd", "skill": "to-prd", "sub": "escreve o plano e publica", "titulo": "/to-prd", "w": 240, "x": 2, "y": 2.9}, {"classe": "auto", "comando": "/to-issues", "detalhe": "Divide o PRD em fatias que podem ser entregues sozinhas, cada uma com os crit\u00e9rios de aceite. O GitHub guarda qual fatia depende de qual.", "id": "toissues", "skill": "to-issues", "sub": "quebra o plano em tarefas", "titulo": "/to-issues", "w": 240, "x": 2, "y": 3.85}, {"classe": "auto", "comando": "/montar-ondas-enxutas", "detalhe": "Olha as fatias abertas, separa as que mexem nos mesmos arquivos e monta as Ondas em ordem. No fim pergunta se pode lan\u00e7ar.", "id": "montar", "skill": "montar-ondas-enxutas", "sub": "monta as Ondas sem conflito", "titulo": "/montar-ondas-enxutas", "w": 240, "x": 2, "y": 4.8}, {"classe": "auto", "comando": "/triage", "detalhe": "O pedido vira uma issue s\u00f3, com a lista do que conta como pronto. Essa lista vira os testes, e \u00e9 ela que o revisor confere. Depois a issue entra na pr\u00f3xima Onda.", "id": "issue", "skill": "triage", "sub": "uma tarefa que diz o que \u00e9 pronto", "titulo": "Issue com crit\u00e9rios", "w": 240, "x": 6, "y": 2.9}, {"classe": "auto", "comando": "/ship \"<descri\u00e7\u00e3o>\"", "detalhe": "Para o ajuste pequeno que j\u00e1 est\u00e1 pronto: salva a mudan\u00e7a, roda os testes e abre o PR, sem PRD e sem issue.", "id": "ship", "skill": "ship", "sub": "o ajuste vai direto para o PR", "titulo": "/ship", "w": 240, "x": 10, "y": 2.9}, {"classe": "auto", "comando": "/onda-enxuta #PRD", "detalhe": "Uma sess\u00e3o de fundo pega as tarefas da Onda, uma por agente, e cada agente abre o PR da sua. Voc\u00ea s\u00f3 entra quando alguma coisa precisa de voc\u00ea, e o aviso chega no celular.", "id": "onda", "notas": ["/tdd: cada tarefa come\u00e7a pelo teste que falha, e o c\u00f3digo vem depois.", "Checagens: os testes, o CI e as lentes de seguran\u00e7a e de design rodam em todo PR.", "Retro: quando a Onda termina, a /retro-onda pode tirar dela o que melhorar no fluxo."], "skill": "onda-enxuta", "sub": ["o agente faz as tarefas em lotes", "e abre um PR por tarefa"], "titulo": "/onda-enxuta", "w": 420, "x": 4, "y": 6.0}, {"classe": "auto", "comando": "agentes onda-revisor e onda-corretor", "detalhe": "Um agente que n\u00e3o escreveu o c\u00f3digo l\u00ea o PR procurando s\u00f3 o que \u00e9 grave. Se achar problema, outro agente corrige e os testes rodam de novo. Depois de tr\u00eas tentativas sem sucesso, a tarefa volta para uma pessoa com o motivo escrito.", "id": "revisao", "sub": ["um revisor l\u00ea o PR uma vez", "o corretor conserta o que ele achar"], "titulo": "Revis\u00e3o", "w": 420, "x": 6, "y": 7.3}, {"classe": "auto", "comando": "fechar_onda.py", "detalhe": "Com a revis\u00e3o e o CI verdes, a subida junta os PRs na main um de cada vez. Se um der problema, s\u00f3 ele sai do lote e os outros seguem.", "id": "merge", "sub": "um PR de cada vez", "titulo": "Merge", "w": 240, "x": 6, "y": 8.4}, {"classe": "auto", "comando": "fechar_onda.py", "detalhe": "Um deploy por Onda: a vers\u00e3o nova sobe, e a subida confere se o app responde com ela. No Projeto que n\u00e3o tem deploy, o caminho termina no merge.", "id": "deploy", "sub": "a vers\u00e3o nova vai para o ar", "titulo": "Deploy", "w": 240, "x": 6, "y": 9.5}, {"classe": "fim", "comando": "/divulgar, ou Gerar demonstra\u00e7\u00e3o na aba Ondas", "detalhe": "Com a entrega no ar, o v\u00eddeo narrado e a p\u00e1gina mostram o que mudou para quem usa. Um PRD tem uma Demonstra\u00e7\u00e3o s\u00f3, com as fatias juntas.", "id": "demonstracao", "sub": "o v\u00eddeo do que mudou", "titulo": "Demonstra\u00e7\u00e3o", "w": 240, "x": 6, "y": 10.6}], "portas": [{"caminho": "/to-prd, /to-issues, /montar-ondas-enxutas, /onda-enxuta", "porta": "A. PRD e fatias", "quando": "Pedido grande: vira v\u00e1rias tarefas, mexe no banco ou quem decide precisa saber"}, {"caminho": "/triage, e a issue entra na Onda", "porta": "B. Issue \u00fanica", "quando": "Uma tarefa s\u00f3, que cabe numa sess\u00e3o"}, {"caminho": "/ship \"<descri\u00e7\u00e3o>\"", "porta": "C. PR direto", "quando": "Ajuste pequeno, que j\u00e1 est\u00e1 pronto"}], "raias": [{"id": "a", "titulo": "A. PRD e fatias", "x1": 0.1, "x2": 4.0, "y1": 2.35, "y2": 5.7}, {"id": "b", "titulo": "B. Issue \u00fanica", "x1": 4.1, "x2": 8.0, "y1": 2.35, "y2": 5.7}, {"id": "c", "titulo": "C. PR direto", "x1": 8.1, "x2": 11.9, "y1": 2.35, "y2": 5.7}], "tipo": "fluxo", "titulo": "Fluxo do time"}, "glossario": "# IAE\n\nProjeto dos s\u00f3cios Pedro, Rib e Lucas para o IAE, escola de pr\u00e1tica jur\u00eddica para advogados in-house. O produto \u00e9 a plataforma de cursos online do IAE. O trabalho \u00e9 acompanhado nas GitHub Issues e na P\u00e1gina do Projeto.\n\n## Pessoas e pap\u00e9is\n\n**S\u00f3cio**:\nUm dos tr\u00eas donos da empresa que presta o servi\u00e7o: Pedro, Rib ou Lucas.\n_Avoid_: Parceiro, dev\n\n**Cliente**:\nO IAE, a institui\u00e7\u00e3o que contrata o servi\u00e7o.\n_Avoid_: Usu\u00e1rio\n\n**Ponte t\u00e9cnica**:\nA pessoa do lado do Cliente que acompanha a parte t\u00e9cnica do projeto. Hoje \u00e9 a Helena Lannes.\n_Avoid_: Dev do cliente\n\n## Produto\n\n**Aluno**:\nQuem assiste \u00e0s Aulas. Entra na Plataforma de cursos com e-mail e senha e s\u00f3 v\u00ea os Cursos em que tem Matr\u00edcula.\n_Avoid_: Usu\u00e1rio, estudante, membro\n\n**Admin**:\nQuem cuida do conte\u00fado e dos Alunos na Plataforma de cursos: cria Cursos e Aulas, vincula V\u00eddeos e faz Matr\u00edculas.\n_Avoid_: Gestor, administrador do sistema, Operador\n\n**Curso**:\nUm conjunto ordenado de Aulas que o Aluno compra ou recebe de uma vez. Na primeira vers\u00e3o n\u00e3o tem m\u00f3dulos.\n_Avoid_: Treinamento, programa, trilha\n\n**Matr\u00edcula**:\nO v\u00ednculo entre um Aluno e um Curso que d\u00e1 o direito de assistir \u00e0s Aulas dele.\n_Avoid_: Acesso, inscri\u00e7\u00e3o, enrollment\n\n**Plataforma de cursos**:\nO produto do projeto: o site onde os alunos assistem \u00e0s aulas do IAE.\n_Avoid_: \u00c1rea de membros (\u00e9 s\u00f3 uma parte dela), LMS\n\n## Processo\n\n**P\u00e1gina do Projeto**:\nA p\u00e1gina do IAE no PedroOS, o painel do Pedro, que mostra o andamento do trabalho a partir do GitHub. S\u00f3 l\u00ea dados, n\u00e3o guarda nada. Substituiu o antigo IAE OS, que morava em `tools/workflow-dashboard/`.\n_Avoid_: IAE OS, Dashboard, Hospital OS\n\n**Clonagem**:\nCopiar o modelo do Hospital OS para o IAE. O Hospital continua igual, e cada c\u00f3pia evolui sozinha depois.\n_Avoid_: Migra\u00e7\u00e3o\n\n## V\u00eddeo\n\n**Original**:\nO arquivo de v\u00eddeo como sai da grava\u00e7\u00e3o (c\u00e2mera, OBS ou Zoom), antes de qualquer convers\u00e3o.\n_Avoid_: Master, arquivo bruto, raw\n\n**V\u00eddeo**:\nO pacote convertido para a web (lista e peda\u00e7os em v\u00e1rios tamanhos), identificado por um uuid e guardado no armazenamento. Uma Aula aponta para zero ou um V\u00eddeo.\n_Avoid_: Asset, m\u00eddia, arquivo\n\n**Aula**:\nA unidade de um curso que o aluno abre e assiste. Uma grava\u00e7\u00e3o de live vira Aula pelo mesmo caminho.\n_Avoid_: Lesson, li\u00e7\u00e3o, v\u00eddeo (quando se fala da unidade do curso)\n\n**Operador**:\nA pessoa que converte o Original e sobe o V\u00eddeo. Hoje, Pedro e a Ponte t\u00e9cnica.\n_Avoid_: Admin (o Operador n\u00e3o precisa ser admin da plataforma), uploader\n", "projeto": "IAE", "repo_url": "https://github.com/pedrorezendefig/iae", "temas": [{"numeros": [1], "tema": "Fluxo de trabalho"}, {"numeros": [2, 3], "tema": "Plataforma de cursos"}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('dados').textContent);
  D.adrs = D.adrs || [];
  D.temas = D.temas || [];

  // ---------- utilitários (markdown.ts, ligacoes.ts e abas.ts do app) ----------

  const escapar = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const normalizar = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').normalize('NFC').toLowerCase();
  const escaparRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const linhasDe = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);
  const num4 = (n) => String(n).padStart(4, '0');
  const cortar = (t, max) => (t.length <= max ? t : `${t.slice(0, Math.max(1, max - 1)).trimEnd()}…`);
  const slugDe = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const f1 = (v) => v.toFixed(1);

  function linhaMd(texto) {
    const guardados = [];
    const guardar = (h) => `\u0000${guardados.push(h) - 1}\u0000`;
    let t = texto.replace(/`([^`]+)`/g, (_m, c) => guardar(`<code>${escapar(c)}</code>`));
    t = t.replace(/!\[([^\]]*)\]\([^)]*\)/g, (_m, alt) => (alt ? `[${alt}]` : ''));
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^)]*")?\)/g, (_m, txt, url) =>
      (/^https?:\/\//i.test(url) ? `${guardar(`<a href="${escapar(url)}" target="_blank" rel="noreferrer">`)}${txt}${guardar('</a>')}` : txt));
    t = escapar(t);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
    t = t.replace(/(^|[^\w])_(?!\s)(.+?)_(?!\w)/g, '$1<em>$2</em>');
    return t.replace(/\u0000(\d+)\u0000/g, (_m, i) => guardados[Number(i)]);
  }

  const celulas = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const ehSeparador = (l) => /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);

  function markdown(fonte, nivelBase = 3) {
    const linhas = (fonte || '').replace(/<!--[\s\S]*?-->/g, '').replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < linhas.length) {
      const l = linhas[i];
      if (!l.trim()) { i += 1; continue; }
      const cerca = /^\s*(```|~~~)\s*([\w-]*)/.exec(l);
      if (cerca) {
        const corpo = [];
        i += 1;
        while (i < linhas.length && !linhas[i].trim().startsWith(cerca[1])) corpo.push(linhas[i++]);
        i += 1;
        const lang = cerca[2] ? ` class="lang-${escapar(cerca[2])}"` : '';
        out.push(`<pre><code${lang}>${escapar(corpo.join('\n'))}</code></pre>`);
        continue;
      }
      const titulo = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l);
      if (titulo) {
        const n = Math.min(6, nivelBase + Math.max(0, titulo[1].length - 2));
        out.push(`<h${n}>${linhaMd(titulo[2])}</h${n}>`);
        i += 1;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i += 1; continue; }
      if (/^\s*\|/.test(l) && i + 1 < linhas.length && ehSeparador(linhas[i + 1])) {
        const cab = celulas(l);
        i += 2;
        const corpo = [];
        while (i < linhas.length && /^\s*\|/.test(linhas[i])) corpo.push(celulas(linhas[i++]));
        out.push(`<div class="md-tabela"><table><thead><tr>${cab.map((c) => `<th>${linhaMd(c)}</th>`).join('')}</tr></thead><tbody>${
          corpo.map((r) => `<tr>${r.map((c) => `<td>${linhaMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {
        const corpo = [];
        while (i < linhas.length && /^\s*>/.test(linhas[i])) corpo.push(linhas[i++].replace(/^\s*>\s?/, ''));
        out.push(`<blockquote>${markdown(corpo.join('\n'), nivelBase)}</blockquote>`);
        continue;
      }
      const item = /^\s*([-*+]|\d+[.)])\s+/;
      if (item.test(l)) {
        const ordenada = /^\s*\d/.test(l);
        const itens = [];
        while (i < linhas.length && (item.test(linhas[i]) || (/^\s{2,}\S/.test(linhas[i]) && itens.length))) {
          if (item.test(linhas[i])) itens.push(linhas[i].replace(item, '').replace(/^\[([ xX])\]\s+/, (_m, x) => (x.trim() ? '☑ ' : '☐ ')));
          else itens[itens.length - 1] += ` ${linhas[i].trim()}`;
          i += 1;
        }
        const tag = ordenada ? 'ol' : 'ul';
        out.push(`<${tag}>${itens.map((x) => `<li>${linhaMd(x)}</li>`).join('')}</${tag}>`);
        continue;
      }
      const paragrafo = [];
      while (i < linhas.length && linhas[i].trim() && !/^\s*(#{1,6}\s|```|~~~|>|\||([-*+]|\d+[.)])\s)/.test(linhas[i])) paragrafo.push(linhas[i++].trim());
      if (!paragrafo.length) paragrafo.push(linhas[i++].trim());
      out.push(`<p>${linhaMd(paragrafo.join(' '))}</p>`);
    }
    return out.join('\n');
  }

  // ---------- o fluxograma (desenharFluxo e pulsosDoFluxo) ----------

  function desenharFluxo(fluxo) {
    const lista = fluxo.nos || [];
    if (!lista.length) return null;
    const CX = (fluxo.grade && fluxo.grade.coluna) || 90;
    const RY = (fluxo.grade && fluxo.grade.linha) || 96;
    const W = (fluxo.grade && fluxo.grade.largura) || 1080;
    const pos = new Map();
    for (const n of lista) {
      const subs = linhasDe(n.sub);
      const w = n.w || 200;
      const h = 40 + 14 * Math.max(subs.length, 1);
      pos.set(n.id, { n, subs, cx: n.x * CX, top: n.y * RY, w, h, cy: n.y * RY + h / 2 });
    }
    const arestas = [];
    for (const a of fluxo.arestas || []) {
      const A = pos.get(a.de);
      const B = pos.get(a.para);
      if (!A || !B) continue;
      const modo = a.modo || (Math.abs(A.cy - B.cy) < 1 ? 'reto' : 'baixo');
      let d;
      let lab;
      if (modo === 'reto') {
        const dir = B.cx > A.cx ? 1 : -1;
        const x1 = A.cx + (dir * A.w) / 2;
        const x2 = B.cx - (dir * B.w) / 2;
        d = `M ${f1(x1)} ${f1(A.cy)} H ${f1(x2)}`;
        lab = { x: (x1 + x2) / 2, y: A.cy - 6, anchor: 'middle' };
      } else if (modo === 'lado') {
        const y1 = A.top + A.h;
        const dir = B.cx > A.cx ? 1 : -1;
        const x2 = B.cx - (dir * B.w) / 2;
        d = `M ${f1(A.cx)} ${f1(y1)} V ${f1(B.cy)} H ${f1(x2)}`;
        lab = { x: (A.cx + x2) / 2, y: B.cy - 6, anchor: 'middle' };
      } else if (modo === 'volta' || modo === 'direita') {
        const x1 = A.cx + A.w / 2;
        const xc = modo === 'volta' ? x1 + 40 : W - 15;
        const x2 = B.cx + B.w / 2;
        d = `M ${f1(x1)} ${f1(A.cy)} H ${f1(xc)} V ${f1(B.cy)} H ${f1(x2)}`;
        lab = { x: xc - 8, y: (A.cy + B.cy) / 2, anchor: 'end' };
      } else {
        const y1 = A.top + A.h;
        const y2 = B.top;
        if (Math.abs(A.cx - B.cx) < 1) {
          d = `M ${f1(A.cx)} ${f1(y1)} V ${f1(y2)}`;
          lab = { x: A.cx + 8, y: (y1 + y2) / 2, anchor: 'start', lado: true };
        } else {
          const ym = y1 + (a.meio == null ? 0.5 : a.meio) * (y2 - y1);
          d = `M ${f1(A.cx)} ${f1(y1)} V ${f1(ym)} H ${f1(B.cx)} V ${f1(y2)}`;
          lab = { x: (A.cx + B.cx) / 2, y: ym - 6, anchor: 'middle' };
        }
      }
      const rot = linhasDe(a.rotulo);
      arestas.push({
        d, de: a.de, para: a.para, tracejada: !!a.tracejada,
        rotulos: rot.map((texto, i) => ({
          texto, anchor: lab.anchor, x: lab.x,
          y: lab.lado ? lab.y + (i - (rot.length - 1) / 2) * 13 + 4 : lab.y - (rot.length - 1 - i) * 13,
        })),
      });
    }
    const raias = (fluxo.raias || []).map((r) => {
      const x = r.x1 * CX;
      const w = (r.x2 - r.x1) * CX;
      const titulo = String(r.titulo || '');
      const chipW = Math.round(titulo.length * 6.8) + 22;
      return { x, y: r.y1 * RY, w, h: (r.y2 - r.y1) * RY, titulo, chipW, chipX: r.alinhar === 'direita' ? x + w - 10 - chipW : x + 10 };
    });
    let H = 0;
    pos.forEach((p) => { H = Math.max(H, p.top + p.h); });
    raias.forEach((r) => { H = Math.max(H, r.y + r.h); });
    return { largura: W, altura: Math.ceil(H) + 12, nos: [...pos.values()], arestas, raias };
  }

  const SEGUNDOS_POR_SETA = 0.9;
  const PAUSA_NO_FIM = 1.2;

  function pulsosDoFluxo(desenho) {
    const vez = new Map(desenho.nos.map((n) => [n.n.id, 0]));
    for (let volta = 0; volta < desenho.nos.length; volta++) {
      for (const a of desenho.arestas) vez.set(a.para, Math.max(vez.get(a.para) || 0, (vez.get(a.de) || 0) + 1));
    }
    const vezes = desenho.arestas.map((a) => vez.get(a.de) || 0);
    const passos = vezes.length ? Math.max(...vezes) + 1 : 0;
    const periodo = passos * SEGUNDOS_POR_SETA + PAUSA_NO_FIM;
    const fracao = (s) => Number((s / periodo).toFixed(4));
    return {
      periodo: Number(periodo.toFixed(2)),
      pulsos: desenho.arestas.map((a, i) => ({ d: a.d, inicio: fracao(vezes[i] * SEGUNDOS_POR_SETA), fim: fracao((vezes[i] + 1) * SEGUNDOS_POR_SETA) })),
    };
  }

  // ---------- decisões e glossário (gruposDeDecisoes, glossario e ligacoes.ts) ----------

  function gruposDeDecisoes(adrs, temas, historico, busca) {
    const q = normalizar(busca.trim());
    const passa = (a) => (historico || a.status === 'accepted') && (!q || normalizar(`${a.title}\n${a.body_md}`).includes(q));
    const maisNovaPrimeiro = (xs) => [...xs].sort((a, b) => b.number - a.number);
    const porNumero = new Map(adrs.map((a) => [a.number, a]));
    const usadas = new Set();
    const grupos = [];
    for (const t of temas) {
      const lista = t.numeros.map((n) => porNumero.get(n)).filter(Boolean);
      lista.forEach((a) => usadas.add(a.number));
      const visiveis = lista.filter(passa);
      if (visiveis.length) grupos.push({ tema: t.tema, adrs: maisNovaPrimeiro(visiveis) });
    }
    const resto = adrs.filter((a) => !usadas.has(a.number) && passa(a));
    if (resto.length) grupos.push({ tema: temas.length ? 'Outras' : 'Decisões', adrs: maisNovaPrimeiro(resto) });
    return grupos;
  }

  function vinculos(a) {
    return [['emenda', a.emenda], ['emendada por', a.emendada_por], ['substitui', a.substitui], ['substituída por', a.substituida_por], ['cita', a.cita]]
      .filter(([, ns]) => ns && ns.length);
  }

  function glossario(md) {
    const secoes = [];
    let atual = null;
    let termo = null;
    for (const l of String(md || '').split('\n')) {
      const h = /^## (.+?)\s*$/.exec(l);
      if (h) { atual = { titulo: h[1], termos: [] }; secoes.push(atual); termo = null; continue; }
      const t = /^\*\*(.+?)\*\*:?\s*(.*)$/.exec(l);
      if (t && atual) { termo = { nome: t[1], slug: slugDe(t[1]), definicao: t[2].trim(), evitar: null }; atual.termos.push(termo); continue; }
      if (!termo) continue;
      if (!l.trim()) { termo = null; continue; }
      const ev = /^_Evitar_:\s*(.*)$/.exec(l.trim());
      if (ev) termo.evitar = ev[1];
      else termo.definicao = `${termo.definicao} ${l.trim()}`.trim();
    }
    return secoes.filter((s) => s.termos.length);
  }

  const casaPalavra = (nome) => new RegExp(`(?<![\\p{L}\\p{N}])${escaparRe(normalizar(nome))}s?(?![\\p{L}\\p{N}])`, 'u');

  function ligarTermosEDecisoes(termos, adrs) {
    const porTermo = new Map();
    const porDecisao = new Map();
    const textos = adrs.map((a) => [a.number, normalizar(`${a.title}\n${a.body_md}`)]);
    for (const t of termos) {
      const re = casaPalavra(t.nome);
      for (const [n, texto] of textos) {
        if (!re.test(texto)) continue;
        porTermo.set(t.slug, [...(porTermo.get(t.slug) || []), n]);
        porDecisao.set(n, [...(porDecisao.get(n) || []), t.slug]);
      }
    }
    return { decisoesDoTermo: (slug) => porTermo.get(slug) || [], termosDaDecisao: (n) => porDecisao.get(n) || [] };
  }

  function marcarTermosNoHtml(html, termos) {
    if (!termos.length) return html;
    const porNome = new Map(termos.map((t) => [normalizar(t.nome), t.slug]));
    const nomes = [...porNome.keys()].sort((a, b) => b.length - a.length).map(escaparRe);
    const re = new RegExp(`(?<![\\p{L}\\p{N}])(${nomes.join('|')})s?(?![\\p{L}\\p{N}])`, 'gu');
    const vistos = new Set();
    let fechado = 0;
    return html.split(/(<[^>]*>)/).map((parte, i) => {
      if (i % 2) {
        const tag = /^<(\/?)(code|pre|a)\b/i.exec(parte);
        if (tag) fechado += tag[1] ? -1 : 1;
        return parte;
      }
      if (fechado > 0 || !parte) return parte;
      let norm = '';
      const origem = [];
      let pos = 0;
      for (const c of parte) {
        for (const n of normalizar(c)) { norm += n; origem.push(pos); }
        pos += c.length;
      }
      origem.push(parte.length);
      let saida = '';
      let ate = 0;
      for (const m of norm.matchAll(re)) {
        const slug = porNome.get(m[1]);
        if (vistos.has(slug)) continue;
        vistos.add(slug);
        const de = origem[m.index];
        const fim = origem[m.index + m[0].length];
        saida += `${parte.slice(ate, de)}<span class="termo-citado" data-termo="${slug}" tabindex="0">${parte.slice(de, fim)}</span>`;
        ate = fim;
      }
      return saida + parte.slice(ate);
    }).join('');
  }

  // ---------- ícones (lucide, os mesmos do app) ----------

  const ICONE = {
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    externo: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    mao: '<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  };
  const icone = (nome, extra = '') => `<svg ${extra} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE[nome]}</svg>`;

  // ---------- o estado da página ----------

  const secoes = glossario(D.glossario);
  const termos = secoes.flatMap((s) => s.termos);
  const ligacoes = ligarTermosEDecisoes(termos, D.adrs);
  const desenho = D.fluxo ? desenharFluxo(D.fluxo) : null;
  const pulsos = desenho ? pulsosDoFluxo(desenho) : null;
  const parado = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PARTES = [['fluxo', 'Fluxo'], ['decisoes', 'Decisões'], ['glossario', 'Glossário']];
  const CLASSE = { auto: 'automático', humano: 'parada humana', decisao: 'decisão', fim: 'produção' };
  const PONTO = { accepted: 'ok', superseded: 'hist', deprecated: 'hist', proposed: 'novo' };
  const STATUS = { accepted: 'aceita', superseded: 'substituída', deprecated: 'abandonada', proposed: 'proposta' };
  const estado = { busca: '', historico: false };
  const explicacoes = new Map();

  const frase = (n) => {
    const m = n.detalhe && /^.*?[.!?](?=\s|$)/.exec(n.detalhe);
    return m ? m[0] : n.detalhe || linhasDe(n.sub).join(', ');
  };
  (D.fluxo && D.fluxo.nos || []).forEach((n) => explicacoes.set(`no:${n.id}`, {
    titulo: n.titulo || n.id, regra: frase(n), campos: n.comando ? [{ rotulo: 'Comando', texto: n.comando }] : [],
  }));
  termos.forEach((t) => explicacoes.set(`termo:${t.slug}`, {
    titulo: t.nome, regra: t.definicao.replace(/`/g, ''), campos: t.evitar ? [{ rotulo: 'Evitar', texto: t.evitar }] : [],
  }));

  function rota() {
    const [s, ...r] = decodeURIComponent(location.hash.replace(/^#/, '')).split('/');
    const parte = PARTES.some(([k]) => k === s) ? s : D.fluxo ? 'fluxo' : 'decisoes';
    return { parte, resto: r.join('/') };
  }
  const abrir = (item) => { location.hash = item ? `#${item}` : '#'; };

  const filtrarGlossario = (busca, manter = '') => {
    const q = normalizar(busca.trim());
    return secoes.map((s) => ({ ...s, termos: s.termos.filter((t) => !q || t.slug === manter || normalizar(`${t.nome} ${t.definicao}`).includes(q)) }))
      .filter((s) => s.termos.length);
  };
  const vazio = (texto) => `<div class="vazio-ala"><p>${escapar(texto)}</p></div>`;
  const tituloDa = (n) => (D.adrs.find((a) => a.number === n) || {}).title;

  // ---------- Fluxo ----------

  function svgDoFluxo(no) {
    const nos = desenho.nos.map(({ n, subs, cx, top, w, h }) => {
      const humano = n.classe === 'humano';
      const x0 = cx - w / 2;
      const tx = humano ? x0 + 34 : cx;
      const largura = w - 20 - (humano ? 24 : 0);
      const ancora = humano ? 'start' : 'middle';
      const rotulo = escapar([n.titulo, ...subs].join(': '));
      return `<g class="fx-explica" data-explica="no:${escapar(n.id)}" aria-label="${rotulo}">`
        + `<g class="fx-no" data-classe="${escapar(n.classe || 'auto')}" data-no="${escapar(n.id)}" data-on="${n.id === no}" role="button" tabindex="0" aria-label="${rotulo}" aria-pressed="${n.id === no}">`
        + `<rect x="${x0}" y="${top}" width="${w}" height="${h}" rx="6"/>`
        + (n.classe === 'decisao' ? `<rect class="fx-dupla" x="${x0 + 3}" y="${top + 3}" width="${w - 6}" height="${h - 6}" rx="4"/>` : '')
        + (humano ? icone('mao', `class="fx-mao" x="${x0 + 8}" y="${top + 9}" width="18" height="18"`) : '')
        + `<text class="fx-t" x="${tx}" y="${top + 21}" text-anchor="${ancora}">${escapar(cortar(n.titulo || n.id, Math.floor(largura / 6.4)))}</text>`
        + subs.map((l, j) => `<text class="fx-s" x="${tx}" y="${top + 37 + j * 14}" text-anchor="${ancora}">${escapar(cortar(String(l), Math.floor(largura / 6)))}</text>`).join('')
        + '</g></g>';
    }).join('');
    const animacao = !parado && pulsos ? `<g class="fx-pulsos" aria-hidden="true">${pulsos.pulsos.map((p) =>
      `<circle class="fx-pulso" r="3.5" opacity="0"><animateMotion path="${p.d}" dur="${pulsos.periodo}s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;${p.inicio};${p.fim};1"/>`
      + `<animate attributeName="opacity" dur="${pulsos.periodo}s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;${p.inicio};${p.fim}"/></circle>`).join('')}</g>` : '';
    return `<svg class="fluxo-svg" viewBox="0 0 ${desenho.largura} ${desenho.altura}" width="${desenho.largura}" role="group" aria-label="Fluxo de trabalho, ${desenho.nos.length} passos">`
      + '<defs><marker id="fx-ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="fx-seta" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>'
      + desenho.raias.map((r) => `<g class="fx-raia"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"/>`
        + `<rect class="fx-raia-chip" x="${r.chipX}" y="${r.y + 10}" width="${r.chipW}" height="22" rx="11"/>`
        + `<text x="${r.chipX + r.chipW / 2}" y="${r.y + 25}" text-anchor="middle">${escapar(r.titulo)}</text></g>`).join('')
      + `<g class="fx-arestas">${desenho.arestas.map((a) => `<path class="fx-aresta" data-tracejada="${a.tracejada}" d="${a.d}" marker-end="url(#fx-ponta)"/>`).join('')}</g>`
      + animacao + nos
      + `<g class="fx-rotulos">${desenho.arestas.flatMap((a) => a.rotulos.map((r) => `<text x="${r.x}" y="${r.y}" text-anchor="${r.anchor}">${escapar(r.texto)}</text>`)).join('')}</g>`
      + '</svg>';
  }

  function passoDoFluxo(no) {
    const n = (D.fluxo.nos || []).find((x) => x.id === no);
    if (!n) return '';
    const subs = linhasDe(n.sub);
    const bloco = (rot, corpo) => `<span class="rotulo-k">${rot}</span>${corpo}`;
    return `<aside class="resumo-pr passo-fluxo" data-classe="${escapar(n.classe || 'auto')}" aria-label="Passo ${escapar(n.titulo)}">`
      + `<div class="resumo-cab"><span class="fase-pr">${escapar(CLASSE[n.classe || 'auto'] || n.classe)}${subs.length ? ` · ${escapar(subs.join(' · '))}` : ''}</span>`
      + `<button type="button" class="btn fantasma pequeno" data-abrir="fluxo" aria-label="Fechar o passo">${icone('x')}</button></div>`
      + `<h3>${escapar(n.titulo)}</h3>`
      + (n.detalhe ? bloco('Como funciona', `<p>${escapar(n.detalhe)}</p>`) : '')
      + (n.porque ? bloco('Por que existe', `<p>${escapar(n.porque)}</p>`) : '')
      + (n.notas && n.notas.length ? bloco('Dentro deste passo', `<ul>${n.notas.map((t) => `<li>${escapar(t)}</li>`).join('')}</ul>`) : '')
      + (n.comando ? bloco('Comando', `<p class="mono">${escapar(n.comando)}</p>`) : '')
      + (n.skill && D.repo_url ? `<a class="repo-link mono" href="${escapar(`${D.repo_url}/blob/main/.claude/skills/${encodeURIComponent(n.skill)}/SKILL.md`)}" target="_blank" rel="noreferrer">.claude/skills/${escapar(n.skill)}/SKILL.md ${icone('externo')}</a>` : '')
      + '</aside>';
  }

  function fluxo(no, conteudo) {
    if (!desenho) { conteudo.innerHTML = vazio('Este repositório não tem o fluxo de trabalho desenhado.'); return; }
    // O desenho fica montado entre um passo e outro, como na aba: o pulso não recomeça a cada clique.
    const camada = conteudo.querySelector('.fluxograma-do-time');
    if (camada) {
      camada.querySelector('.passo-fluxo')?.remove();
      camada.insertAdjacentHTML('afterbegin', passoDoFluxo(no));
      camada.querySelectorAll('.fx-no').forEach((g) => {
        const on = String(g.getAttribute('data-no') === no);
        g.setAttribute('data-on', on);
        g.setAttribute('aria-pressed', on);
      });
      return;
    }
    const f = D.fluxo;
    conteudo.innerHTML = `<h2 class="aba-titulo">${escapar(f.titulo || 'Fluxo de trabalho')}</h2>`
      + '<p class="aba-nota">Passe o mouse num passo para ver o que ele faz e o comando. Clique para ler como ele funciona. Âmbar é onde alguém precisa agir.</p>'
      + `<div class="fluxograma-do-time">${passoDoFluxo(no)}<div class="fluxo-rolagem">${svgDoFluxo(no)}</div>`
      + (f.legenda && f.legenda.length ? `<div class="fx-legenda">${f.legenda.map((l) => `<span data-classe="${escapar(l.classe)}">${escapar(l.texto)}</span>`).join('')}</div>` : '')
      + '</div>'
      + (f.portas && f.portas.length ? '<section class="cartao-area"><h3>As portas de entrada</h3><div class="md-tabela"><table><thead><tr><th>Porta</th><th>Quando</th><th>Caminho</th></tr></thead><tbody>'
        + f.portas.map((p) => `<tr><td><b>${escapar(p.porta)}</b></td><td>${escapar(p.quando)}</td><td class="mono">${escapar(p.caminho)}</td></tr>`).join('')
        + '</tbody></table></div></section>' : '');
  }

  // ---------- Decisões ----------

  function adrAberta(a) {
    const citados = ligacoes.termosDaDecisao(a.number).map((s) => termos.find((t) => t.slug === s)).filter(Boolean);
    return `<aside class="resumo-pr adr-aberta" aria-label="ADR ${num4(a.number)}">`
      + `<div class="resumo-cab"><span class="fase-pr">ADR ${num4(a.number)} · ${escapar(STATUS[a.status] || a.status)}</span>`
      + `<button type="button" class="btn fantasma pequeno" data-abrir="decisoes" aria-label="Fechar a ADR">${icone('x')}</button></div>`
      + `<h3>${escapar(a.title)}</h3>`
      + vinculos(a).map(([rot, ns]) => `<div class="adr-vinculos"><span class="rotulo-k">${rot}</span>${ns.map((n) =>
        `<button type="button" class="chip" data-abrir="decisoes/${n}" title="${escapar(tituloDa(n) || '')}">${num4(n)}${tituloDa(n) ? ` ${escapar(cortar(tituloDa(n), 40))}` : ''}</button>`).join('')}</div>`).join('')
      + (citados.length ? `<div class="adr-vinculos termos-da-decisao"><span class="rotulo-k">termos</span>${citados.map((t) =>
        `<span class="explica termo-glossario" data-explica="termo:${t.slug}"><button type="button" class="chip" data-abrir="glossario/${t.slug}">${escapar(t.nome)}</button></span>`).join('')}</div>` : '')
      + `<div class="md-repo">${marcarTermosNoHtml(markdown(a.body_md, 4), citados)}</div>`
      + (D.repo_url ? `<a class="repo-link mono" href="${escapar(`${D.repo_url}/blob/main/${a.file}`)}" target="_blank" rel="noreferrer">${escapar(a.file)} ${icone('externo')}</a>` : '')
      + '</aside>';
  }

  function decisoes(aberta, conteudo) {
    if (!D.adrs.length) { conteudo.innerHTML = vazio('Este repositório não tem docs/adr.'); return; }
    const fora = D.adrs.filter((a) => a.status !== 'accepted').length;
    const adr = D.adrs.find((a) => a.number === aberta) || null;
    const grupos = gruposDeDecisoes(D.adrs, D.temas, estado.historico, estado.busca);
    conteudo.innerHTML = (fora ? `<div class="filtros"><button type="button" class="chip" data-acao="historico" aria-pressed="${estado.historico}">Ver histórico <span class="num">${fora}</span></button></div>` : '')
      + (adr ? adrAberta(adr) : '')
      + (grupos.length ? '' : vazio('Nenhuma decisão com essa busca.'))
      + grupos.map((g) => `<details class="tema-adr" open><summary><span>${escapar(g.tema)}</span> <span class="num">${g.adrs.length}</span></summary>`
        + `<div class="grade-adr linha-do-tempo">${g.adrs.map((a) =>
          `<button type="button" class="adr-mini" data-status="${PONTO[a.status] || 'erro'}" aria-pressed="${a.number === aberta}" data-abrir="${a.number === aberta ? 'decisoes' : `decisoes/${a.number}`}" title="${escapar(a.decisao.replace(/\*\*|`/g, ''))}">`
          + `<span class="adr-cab"><span class="mono">${num4(a.number)}</span><span class="adr-ponto" aria-label="${escapar(STATUS[a.status] || a.status)}"></span></span>`
          + `<span class="adr-titulo">${escapar(a.title)}</span>`
          + (a.substituida_por.length ? `<span class="nota">substituída pela ${a.substituida_por.map(num4).join(', ')}</span>` : '')
          + '</button>').join('')}</div></details>`).join('');
    if (adr) conteudo.querySelector('.adr-aberta').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ---------- Glossário ----------

  function glossarioDaPagina(alvo, conteudo) {
    if (!D.glossario) { conteudo.innerHTML = vazio('Este repositório não tem CONTEXT.md.'); return; }
    const filtradas = filtrarGlossario(estado.busca, alvo);
    if (secoes.length && !filtradas.length) { conteudo.innerHTML = vazio('Nenhum termo com essa busca.'); return; }
    conteudo.innerHTML = `<nav class="indice-glossario" aria-label="Termos">${filtradas.map((s) => `<div><span class="rotulo-k">${escapar(s.titulo)}</span><div class="chips-pequenos">`
        + s.termos.map((t) => `<button type="button" class="chip" aria-pressed="${t.slug === alvo}" data-abrir="glossario/${t.slug}">${escapar(t.nome)}</button>`).join('')
        + '</div></div>').join('')}</nav>`
      + filtradas.map((s) => `<section class="secao-glossario"><h2 class="aba-titulo">${escapar(s.titulo)}</h2><dl>${s.termos.map((t) => {
        const ds = [...ligacoes.decisoesDoTermo(t.slug)].sort((a, b) => b - a);
        return `<div id="g-${t.slug}" class="termo" data-alvo="${t.slug === alvo}"><dt>${escapar(t.nome)}</dt><dd>`
          + `<span>${markdown(t.definicao).replace(/^<p>|<\/p>$/g, '')}</span>`
          + (t.evitar ? `<span class="evitar">Evitar: ${escapar(t.evitar)}</span>` : '')
          + (ds.length ? `<span class="adr-vinculos decisoes-do-termo"><span class="rotulo-k">decisões</span>${ds.map((n) =>
            `<button type="button" class="chip" data-abrir="decisoes/${n}" title="${escapar(tituloDa(n) || '')}">${num4(n)} ${escapar(cortar(tituloDa(n) || '', 40))}</button>`).join('')}</span>` : '')
          + '</dd></div>';
      }).join('')}</dl></section>`).join('')
      + `<details class="fonte-md"><summary>Ver o CONTEXT.md inteiro</summary><div class="md-repo">${markdown(D.glossario)}</div></details>`;
    if (alvo) document.getElementById(`g-${alvo}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ---------- o Cartão de explicação (Explica e ExplicaNoSvg) ----------

  const LARGURA = 280;
  let aberto = null;

  function cartao(ex) {
    const el = document.createElement('span');
    el.className = 'explica-cartao';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', ex.titulo);
    el.innerHTML = `<span class="micro">${escapar(ex.titulo)}</span><span class="explica-regra">${escapar(ex.regra)}</span>`
      + (ex.campos.length ? `<dl class="explica-campos">${ex.campos.map((c) => `<div><dt>${escapar(c.rotulo)}</dt><dd>${escapar(c.texto)}</dd></div>`).join('')}</dl>` : '');
    return el;
  }

  function fecharCartao() {
    if (aberto) aberto.cartao.remove();
    aberto = null;
  }

  // A caixa do fluxograma e o termo citado no texto da decisão abrem o cartão solto na camada (fora da rolagem),
  // logo abaixo deles; o chip do termo abre dentro dele, como o Explica do app.
  function abrirCartao(alvo) {
    if (aberto && aberto.alvo === alvo) return;
    fecharCartao();
    const chave = alvo.getAttribute('data-explica') || `termo:${alvo.getAttribute('data-termo')}`;
    const ex = explicacoes.get(chave);
    if (!ex) return;
    const el = cartao(ex);
    const camada = alvo.closest('.fluxograma-do-time, .adr-aberta');
    if (alvo.classList.contains('explica') || !camada) {
      alvo.appendChild(el);
    } else {
      const r = alvo.getBoundingClientRect();
      const base = camada.getBoundingClientRect();
      el.classList.add('solto');
      el.style.setProperty('--x', `${Math.max(0, Math.min(r.left - base.left, base.width - LARGURA))}px`);
      el.style.setProperty('--y', `${r.bottom - base.top}px`);
      camada.appendChild(el);
    }
    aberto = { alvo, cartao: el };
  }

  const ALVO = '[data-explica], .termo-citado';
  const conteudo = document.getElementById('conteudo');
  const entrar = (e) => { const alvo = e.target.closest && e.target.closest(ALVO); if (alvo) abrirCartao(alvo); };
  const sair = (e) => {
    if (!aberto) return;
    const para = e.relatedTarget;
    if (!para || !(aberto.alvo.contains(para) || aberto.cartao.contains(para))) fecharCartao();
  };
  conteudo.addEventListener('mouseover', entrar);
  conteudo.addEventListener('focusin', entrar);
  conteudo.addEventListener('mouseout', sair);
  conteudo.addEventListener('focusout', sair);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') fecharCartao();
    const no = e.target.closest && e.target.closest('.fx-no');
    if (no && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); no.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  conteudo.addEventListener('click', (e) => {
    if (aberto && !aberto.cartao.contains(e.target)) fecharCartao();
    const no = e.target.closest('.fx-no');
    if (no) { const id = no.getAttribute('data-no'); abrir(id === rota().resto ? 'fluxo' : `fluxo/${id}`); return; }
    const botao = e.target.closest('[data-abrir], [data-acao]');
    if (!botao) return;
    if (botao.getAttribute('data-acao') === 'historico') { estado.historico = !estado.historico; desenhar(); return; }
    abrir(botao.getAttribute('data-abrir'));
  });

  // ---------- a página ----------

  const busca = document.getElementById('busca');
  busca.addEventListener('input', () => { estado.busca = busca.value; desenhar(); });
  document.getElementById('partes').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) abrir(b.getAttribute('data-parte'));
  });

  let parteDesenhada = null;
  function desenhar() {
    const { parte, resto } = rota();
    const buscando = estado.busca.trim() !== '';
    const achados = {
      decisoes: gruposDeDecisoes(D.adrs, D.temas, estado.historico, estado.busca).reduce((n, g) => n + g.adrs.length, 0),
      glossario: filtrarGlossario(estado.busca).reduce((n, s) => n + s.termos.length, 0),
    };
    document.getElementById('partes').innerHTML = PARTES.map(([k, nome]) =>
      `<button type="button" data-parte="${k}" aria-pressed="${parte === k}">${nome}${buscando && k in achados ? `<span class="num">${achados[k]}</span>` : ''}</button>`).join('');
    document.getElementById('filtros').style.display = parte === 'fluxo' ? 'none' : '';
    document.getElementById('contagem').textContent = `${termos.length} termos · ${D.adrs.length} decisões`;
    fecharCartao();
    if (parte !== parteDesenhada) conteudo.innerHTML = '';
    parteDesenhada = parte;
    if (parte === 'fluxo') fluxo(resto, conteudo);
    else if (parte === 'decisoes') decisoes(Number(resto) || null, conteudo);
    else glossarioDaPagina(resto, conteudo);
  }

  document.getElementById('titulo').textContent = D.projeto || '';
  window.addEventListener('hashchange', desenhar);
  desenhar();
})();
</script>
</body>
</html>
