name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  ferramenta:
    name: Testes e lint de texto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install pyyaml pytest
      - name: Testes de tools/
        run: python -m pytest tools/ -q --ignore=tools/workflow-dashboard
      - name: Lint travessão
        # Travessão (U+2014) e meia-risca (U+2013) no texto que os sócios leem.
        # Os caracteres entram via \x{...} para não existir literal no lint.
        run: |
          if grep -rPln '[\x{2014}\x{2013}]' CONTEXT.md CLAUDE.md docs/adr/; then
            echo "::error::Travessão ou meia-risca nos arquivos acima. Use vírgula, dois-pontos, parênteses ou ponto."
            exit 1
          fi
